spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      filter:
        wall:
          enabled: true
        stat:
          enabled: true
          slow-sql-millis: 1000
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        login-username: root
        login-password: root
        deny:
      filter-class-names: stat,wall
    url: jdbc:mysql://localhost:3308/smart-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
#    url: jdbc:mysql://localhost:3308/smart-system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ming8858*
    name: smart-system
  data:
    redis:
      host: localhost
#      password: ming8858

logging:
  level:
    root: info
    com.smart: debug

management:
  endpoint:
    #    开启shutdown端点
    shutdown:
      enabled: true
    health:
      show-details: always
    logfile:
      enabled: true
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    mail:
      enabled: false

smart:
  log:
    path: D:\zhongming\Documents\01-workspace\06-temp\log
  auth:
    prefix: ${spring.application.name}-${spring.profiles.active}
    jwt:
      permission-cache: true
    sms:
      sign-name: 联亚软件
      template: SMS_279432099
    ignores:
      get:
        - .html
        - /doc.html
        - /webjars/**
        - /v3/api-docs/**
      pattern:
        - /xrebel/**
        - /websocket/**
        - /druid/**
    session:
      timeout:
        global: 360m
    captcha:
      type: TEXT_ARITHMETIC
      text:
        ignoreCase: true
        length: 2

knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
